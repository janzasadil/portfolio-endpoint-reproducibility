[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-endpoint-reproducibility"
version = "1.0.0"
description = "Reproducible portfolio endpoint experiment"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.13.3,<3.14"
authors = [{name = "Jan Zasadil"}]
dependencies = [
  "numpy>=2.3",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[project.scripts]
portfolio-ingest = "portfolio_endpoint.ingest:main"
portfolio-study = "portfolio_endpoint.study:main"
portfolio-diagnostics = "portfolio_endpoint.diagnostics:main"
portfolio-countries = "portfolio_endpoint.countries:main"
portfolio-extension = "portfolio_endpoint.extension:main"
portfolio-qf-publication = "portfolio_endpoint.qf_publication:main"

[project.urls]
Repository = "https://github.com/janzasadil/portfolio-endpoint-reproducibility"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
