[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-endpoint-reproducibility"
version = "0.1.0"
description = "Reproducible portfolio endpoint experiment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
portfolio-ingest = "portfolio_endpoint.ingest:main"
portfolio-study = "portfolio_endpoint.study:main"
portfolio-diagnostics = "portfolio_endpoint.diagnostics:main"
portfolio-report = "portfolio_endpoint.reporting:main"
portfolio-countries = "portfolio_endpoint.countries:main"
portfolio-extension = "portfolio_endpoint.extension:main"
portfolio-country-bootstrap-report = "portfolio_endpoint.country_bootstrap_report:main"
portfolio-frl-publication = "portfolio_endpoint.frl_publication:main"
portfolio-post-referee = "portfolio_endpoint.post_referee:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["src"]
